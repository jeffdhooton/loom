name: stress-coding-multibug
goal: "`pytest -q` passes (all tests green) in the stress sandbox repo."
type: coding
workspace:
  repo: examples/stress-sandbox
  worktree: true
  branch: setpoint/stress-multibug
context:
  notes: |
    mathlib.py contains several independent bugs across add, is_even, factorial,
    gcd, clamp, and mean. test_mathlib.py is a comprehensive suite that is fully
    satisfiable by a correct implementation. Run `pytest -q` to see the failures,
    fix the bugs in mathlib.py (do NOT edit the tests), and re-run until all pass.
    Use bash to run pytest and search/read to inspect the code.
execute:
  plan_model: deepseek-v4-pro
  model: deepseek-v4-flash
  tools: [read, edit, bash, search]
verify:
  gate: command
  command: "pytest -q"
stop:
  max_iters: 10
  no_progress_after: 3
budget:
  max_usd: 1.00
