[project]
name = "loom"
version = "0.1.0"
description = "Closed-loop engine for AI agents: DISCOVER -> PLAN -> EXECUTE -> VERIFY -> ITERATE until a real gate passes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeff Hooton" }]
keywords = ["ai", "agents", "llm", "automation", "verification", "deepseek", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/jeffdhooton/loom"
Issues = "https://github.com/jeffdhooton/loom/issues"

[project.scripts]
loom = "loom.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
