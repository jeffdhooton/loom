[project]
name = "loom"
version = "0.1.0"
description = "Standalone DeepSeek-v4 loop engine (DISCOVER->PLAN->EXECUTE->VERIFY->ITERATE)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
loom = "loom.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loom*"]
